[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "desktickets_v2"
version = "0.1.0"
description = "Small mock Python app used to align VS Code, Codex, and GitHub."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
desktickets_v2 = "desktickets_v2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]